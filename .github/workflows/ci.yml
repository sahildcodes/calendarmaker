name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        env:
          ADMIN_PASSWORD: ci-test-admin-password
          SESSION_SECRET_KEY: ci-test-session-secret-key-at-least-32-characters
        run: pytest -q
